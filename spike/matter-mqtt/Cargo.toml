[package]
name = "matter-mqtt"
version = "0.1.0"
edition = "2024"
description = "Spike: own Matter fabric, subscribe to every commissioned node, print reports as MQTT-shaped lines"
publish = false

[dependencies]
anyhow = "1"
axum = "0.8"
clap = { version = "4", features = ["derive"] }
matter-codec = "0.3.2"
matter-controller = { version = "0.18.3", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
